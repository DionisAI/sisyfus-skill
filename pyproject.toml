[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sisyfus"
version = "0.8.0"
description = "Local-first agent orchestration with an event-sourced, verifier-gated branching research skill and HTML Observatory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sisyfus Project" }]
keywords = ["agents", "loop", "orchestration", "memory", "verification", "coding-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DionisAI/sisyfus-skill"
Changelog = "https://github.com/DionisAI/sisyfus-skill/blob/main/CHANGELOG.md"

[project.scripts]
sisyfus = "sisyfus.cli:main"
sisyfus-autonomy = "sisyfus.autonomy.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
sisyfus = ["skill_assets/sisyfus-research/*", "skill_assets/sisyfus-research/references/*", "skill_assets/sisyfus-research/templates/*"]
