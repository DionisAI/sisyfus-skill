name: Apply Phase 0A hardening

on:
  push:
    branches:
      - feat/autonomous-agent-v08

permissions:
  contents: write

concurrency:
  group: apply-phase0a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-agent-v08
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/phase0a-patch/patch.gz.b64 | gzip -d > /tmp/phase0a.patch
          echo "d32086148f1dab70b416d55bf7226014623e4eba1429e9416c89cbb476b32955  /tmp/phase0a.patch" | sha256sum -c -
          git apply --check /tmp/phase0a.patch

      - name: Apply patch
        run: git apply /tmp/phase0a.patch

      - name: Install package and tests
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .

      - name: Compile package
        run: python -m compileall -q src

      - name: Run tests
        env:
          SISYFUS_AUTO_SERVE: "0"
        run: python -m pytest -q

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/phase0a-patch/part-00.b64
          rm -f .github/phase0a-patch/patch.gz.b64
          rmdir .github/phase0a-patch
          rm -f .github/workflows/apply-phase0a.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/ci.yml \
            src/sisyfus/research_v2/engine.py \
            src/sisyfus/research_v2/workspace.py \
            tests/test_research_engine.py \
            .github/phase0a-patch/part-00.b64 \
            .github/phase0a-patch/patch.gz.b64 \
            .github/workflows/apply-phase0a.yml
          git diff --cached --check
          git commit -m "phase0: serialize state transitions and trust engine telemetry"
          git push origin HEAD:feat/autonomous-agent-v08
