name: Harden Sisyfus updater atomicity

on:
  push:
    branches:
      - feat/self-update-v081
    paths:
      - .github/updater-hardening/**
      - .github/workflows/apply-updater-hardening.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/updater-hardening/**
      - .github/workflows/apply-updater-hardening.yml

permissions:
  contents: write

concurrency:
  group: updater-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/self-update-v081
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply hardening changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/updater-hardening/apply.py")
          text = path.read_text(encoding="utf-8")

          literal_replacements = {
              'pattern.subn(replacement.rstrip() + "\\n\\n", text, count=1)': (
                  'pattern.subn(lambda _match: replacement.rstrip() + "\\n\\n", '
                  'text, count=1)'
              ),
              'pattern.subn(replacement.rstrip() + "\\n", text, count=1)': (
                  'pattern.subn(lambda _match: replacement.rstrip() + "\\n", '
                  'text, count=1)'
              ),
          }
          for before, after in literal_replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(
                      f"unexpected hardening patch marker: {before!r}"
                  )
              text = text.replace(before, after, 1)

          raw_template_replacements = [
              (
                  "build_helpers = '''def _release_content_hash",
                  "build_helpers = r'''def _release_content_hash",
                  1,
              ),
              (
                  "    \"_load_manifest\",\n    '''def _load_manifest(",
                  "    \"_load_manifest\",\n    r'''def _load_manifest(",
                  1,
              ),
              (
                  "    \"configure_auto\",\n    '''    def configure_auto(",
                  "    \"configure_auto\",\n    r'''    def configure_auto(",
                  1,
              ),
              (
                  "TESTS = '''from __future__ import annotations",
                  "TESTS = r'''from __future__ import annotations",
                  1,
              ),
          ]
          for before, after, expected in raw_template_replacements:
              count = text.count(before)
              if count != expected:
                  raise SystemExit(
                      f"unexpected raw-template marker count: "
                      f"{count} != {expected} for {before!r}"
                  )
              text = text.replace(before, after, 1)

          old_block = '''cli = read("src/sisyfus/cli.py")
          old = "allow_active=args.allow_active)"
          new = "allow_active=args.allow_active, require_verified=args.scheduled)"
          count = cli.count(old)
          if count != 2:
              raise SystemExit(f"unexpected UpdateManager.apply call count: {count}")
          write("src/sisyfus/cli.py", cli.replace(old, new))'''
          new_block = '''cli = read("src/sisyfus/cli.py")
          old = (
              "manager.apply(channel=args.channel,version=args.target_version,"
              "force=args.force,allow_active=args.allow_active)"
          )
          new = (
              "manager.apply(channel=args.channel,version=args.target_version,"
              "force=args.force,allow_active=args.allow_active,"
              "require_verified=args.scheduled)"
          )
          count = cli.count(old)
          if count != 2:
              raise SystemExit(f"unexpected UpdateManager.apply call count: {count}")
          write("src/sisyfus/cli.py", cli.replace(old, new))'''
          if text.count(old_block) != 1:
              raise SystemExit("unexpected CLI updater patch block")
          text = text.replace(old_block, new_block, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python .github/updater-hardening/apply.py
          python scripts/sync_skill_assets.py
          bash -n install.sh
      - name: Install
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Targeted updater and installer tests
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
          SISYFUS_UPDATE_FORCE_STDLIB: '1'
        run: |
          python -m pytest -q \
            tests/test_updater.py \
            tests/test_updater_hardening.py \
            tests/test_update_cli.py \
            tests/test_release_assets.py \
            tests/test_release_version.py \
            tests/test_skill_assets_sync.py
      - name: Complete repository tests
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
          SISYFUS_UPDATE_FORCE_STDLIB: '1'
        run: python -m pytest -q
      - name: Publish validated hardening
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github/updater-hardening
          rm -f .github/workflows/apply-updater-hardening.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: make updater activation atomic and stable-safe'
          git pull --rebase origin feat/self-update-v081
          git push origin HEAD:feat/self-update-v081
