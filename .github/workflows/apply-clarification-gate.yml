name: Apply proactive clarification gate

on:
  push:
    branches:
      - feat/autonomous-agent-v08
    paths:
      - .github/clarification-gate/**
      - .github/workflows/apply-clarification-gate.yml

permissions:
  contents: write

concurrency:
  group: apply-clarification-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-agent-v08
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply clarification gate
        run: |
          python .github/clarification-gate/apply.py
          python scripts/sync_skill_assets.py

      - name: Install
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test clarification and Mission Control
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
        run: |
          python -m pytest -q \
            tests/test_activity_monitor.py \
            tests/test_skill_clarification_gate.py \
            tests/test_skill_assets_sync.py

      - name: Test complete repository
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
        run: python -m pytest -q

      - name: Publish validated clarification gate
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github/clarification-gate
          rm -f .github/workflows/apply-clarification-gate.yml
          git add -- \
            SKILL.md \
            references/live-mission-control.md \
            src/sisyfus/skill_assets/sisyfus-research/SKILL.md \
            src/sisyfus/skill_assets/sisyfus-research/references/live-mission-control.md \
            src/sisyfus/activity.py \
            src/sisyfus/cli.py \
            tests/test_activity_monitor.py \
            tests/test_skill_clarification_gate.py
          git add -u -- \
            .github/clarification-gate \
            .github/workflows/apply-clarification-gate.yml
          git diff --cached --check
          git commit -m 'feat: require proactive clarification before research'
          git push origin HEAD:feat/autonomous-agent-v08
