name: Apply exact reviewed Research OS continuation
on:
  push:
    branches: [feat/closed-loop-research-os]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact patch
        run: |
          cat .github/research-os-exact.0a .github/research-os-exact.0b .github/research-os-exact.1 .github/research-os-exact.2 .github/research-os-exact.3 .github/research-os-exact.4 | base64 -d | gzip -d > /tmp/exact.patch
          echo "9de56ba718223222f654a0c9f3fd6420549b5b66807dcb964946e2577f7c1c06  /tmp/exact.patch" | sha256sum -c -
          git apply --check /tmp/exact.patch
          git apply /tmp/exact.patch
          rm -f .github/research-os-next-patch.* .github/research-os-exact.*
          rm .github/workflows/research-os-exact-transfer.yml
      - name: Validate
        env:
          SISYFUS_AUTO_SERVE: '0'
        run: |
          python -m pip install pytest
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(research-os): add learnable SOP and address review findings'
          git push origin HEAD:refs/heads/feat/closed-loop-research-os
