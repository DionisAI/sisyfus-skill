name: Apply Sisyfus self-update runtime

on:
  push:
    branches:
      - feat/self-update-v081
    paths:
      - .github/self-update/**
      - .github/workflows/apply-self-update.yml

permissions:
  contents: write

concurrency:
  group: apply-self-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/self-update-v081
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Materialize updater, installer, docs and tests
        run: |
          python .github/self-update/apply.py
          python scripts/sync_skill_assets.py
          bash -n install.sh
      - name: Install
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Targeted updater tests
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
          SISYFUS_UPDATE_FORCE_STDLIB: '1'
        run: |
          python -m pytest -q \
            tests/test_updater.py \
            tests/test_update_cli.py \
            tests/test_release_assets.py \
            tests/test_release_version.py \
            tests/test_skill_assets_sync.py
      - name: Complete repository tests
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
          SISYFUS_UPDATE_FORCE_STDLIB: '1'
        run: python -m pytest -q
      - name: Publish validated implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github/self-update
          rm -f .github/workflows/apply-self-update.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: add atomic self-update and rollback'
          git pull --rebase origin feat/self-update-v081
          git push origin HEAD:feat/self-update-v081
