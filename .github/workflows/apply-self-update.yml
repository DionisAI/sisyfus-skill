name: Apply Sisyfus self-update runtime

on:
  push:
    branches:
      - feat/self-update-v081
    paths:
      - .github/self-update/**
      - .github/workflows/apply-self-update.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/self-update/**
      - .github/workflows/apply-self-update.yml

permissions:
  contents: write

concurrency:
  group: apply-self-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/self-update-v081
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Materialize updater, installer, docs and tests
        run: |
          python .github/self-update/apply.py
          cat > scripts/build_release_assets.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path


          def project_version(root: Path) -> str:
              text = (root / "pyproject.toml").read_text(encoding="utf-8")
              match = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', text)
              if not match:
                  raise SystemExit("pyproject.toml has no project version")
              return match.group(1)


          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--output", default="dist")
              parser.add_argument(
                  "--repository", default="DionisAI/sisyfus-skill"
              )
              args = parser.parse_args(argv)

              root = Path(__file__).resolve().parents[1]
              version = project_version(root)
              tag = f"v{version}"
              ref = os.environ.get("GITHUB_REF_NAME") or tag
              if ref != tag:
                  raise SystemExit(
                      f"release tag {ref!r} does not match package {tag!r}"
                  )

              commit = subprocess.check_output(
                  ["git", "rev-parse", "HEAD"],
                  cwd=root,
                  text=True,
              ).strip()
              output = (root / args.output).resolve()
              output.mkdir(parents=True, exist_ok=True)
              archive = output / f"sisyfus-{version}.tar.gz"
              prefix = f"sisyfus-{version}/"
              subprocess.run(
                  [
                      "git",
                      "archive",
                      "--format=tar.gz",
                      f"--prefix={prefix}",
                      "-o",
                      str(archive),
                      "HEAD",
                  ],
                  cwd=root,
                  check=True,
              )
              digest = sha256(archive)
              manifest = {
                  "schema_version": "sisyfus.release.v1",
                  "repository": args.repository,
                  "version": version,
                  "tag": tag,
                  "commit_sha": commit,
                  "archive_name": archive.name,
                  "archive_sha256": digest,
                  "minimum_python": "3.11",
                  "autonomy_schema_version": 2,
                  "breaking": False,
              }
              (output / "release-manifest.json").write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              (output / f"{archive.name}.sha256").write_text(
                  f"{digest}  {archive.name}\n",
                  encoding="utf-8",
              )
              print(json.dumps(manifest, sort_keys=True))
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x scripts/build_release_assets.py
          python - <<'PY'
          from pathlib import Path

          updater_tests = Path("tests/test_updater.py")
          text = updater_tests.read_text(encoding="utf-8")
          marker = "from sisyfus.updater import *\n"
          addition = (
              marker
              + "from sisyfus.updater import "
              + "_activate_release, _build_release, _safe_extract\n"
          )
          if addition not in text:
              if text.count(marker) != 1:
                  raise SystemExit("unexpected updater import marker")
              text = text.replace(marker, addition, 1)
          updater_tests.write_text(text, encoding="utf-8")

          release_test = Path("tests/test_release_version.py")
          text = release_test.read_text(encoding="utf-8")
          text = text.replace('VERSION = "0.8.0"', 'VERSION = "0.8.1"')
          text = text.replace('TAG = "v0.8.0"', 'TAG = "v0.8.1"')
          release_test.write_text(text, encoding="utf-8")

          updater = Path("src/sisyfus/updater.py")
          text = updater.read_text(encoding="utf-8")
          before = "        bundle.extractall(destination)\n"
          after = (
              "        try:\n"
              "            bundle.extractall(destination, filter=\"data\")\n"
              "        except TypeError:  # Python versions before extraction filters\n"
              "            bundle.extractall(destination)\n"
          )
          if after not in text:
              if text.count(before) != 1:
                  raise SystemExit("unexpected tar extraction marker")
              text = text.replace(before, after, 1)
          updater.write_text(text, encoding="utf-8")
          PY
          python scripts/sync_skill_assets.py
          bash -n install.sh
      - name: Install
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Targeted updater tests
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
          SISYFUS_UPDATE_FORCE_STDLIB: '1'
        run: |
          python -m pytest -q \
            tests/test_updater.py \
            tests/test_update_cli.py \
            tests/test_release_assets.py \
            tests/test_release_version.py \
            tests/test_skill_assets_sync.py
      - name: Complete repository tests
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
          SISYFUS_UPDATE_FORCE_STDLIB: '1'
        run: python -m pytest -q
      - name: Publish validated implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github/self-update
          rm -f .github/workflows/apply-self-update.yml
          # The GitHub Actions token cannot create workflows. The validated
          # release workflow is added through the repository API after this push.
          rm -f .github/workflows/release.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: add atomic self-update and rollback'
          git pull --rebase origin feat/self-update-v081
          git push origin HEAD:feat/self-update-v081
