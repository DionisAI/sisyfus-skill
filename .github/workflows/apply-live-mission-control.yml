name: Apply live Mission Control

on:
  push:
    branches:
      - feat/autonomous-agent-v08
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-live-mission-control-${{ github.ref }}
  cancel-in-progress: true

# Materialize, validate, and publish the monitor-first implementation.
jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-agent-v08
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Materialize and apply monitor-first lifecycle
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/live-mission-control/part-*.b64 | base64 -d > /tmp/live-mission-control.tgz
          echo "efc16dbaffe84e1d3a4ab46e5efed04437ff0745196f9aead30ce4ea9a55e269  /tmp/live-mission-control.tgz" | sha256sum -c -
          tar -xzf /tmp/live-mission-control.tgz -C .
          python .github/live-mission-control/apply.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sisyfus/activity.py")
          text = path.read_text(encoding="utf-8")
          before = '''def read_activity_events(root: str | Path) -> list[dict[str, Any]]:
              loaded = _read_json(activity_events_projection_path(root), {})
              events = loaded.get("events") if isinstance(loaded, dict) else []
              return [dict(item) for item in events if isinstance(item, dict)]
          '''.replace("\n          ", "\n")
          after = '''def read_activity_events(root: str | Path) -> list[dict[str, Any]]:
              loaded = _read_json(activity_events_projection_path(root), {})
              events = loaded.get("events") if isinstance(loaded, dict) else []
              if not isinstance(events, list):
                  return []
              return [dict(item) for item in events if isinstance(item, dict)]
          '''.replace("\n          ", "\n")
          if text.count(before) != 1:
              raise SystemExit("unexpected read_activity_events implementation")
          path.write_text(text.replace(before, after, 1), encoding="utf-8")
          PY

      - name: Install
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test live Mission Control and autonomy integration
        env:
          SISYFUS_AUTO_SERVE: "0"
          SISYFUS_AUTO_OPEN: "0"
        run: |
          python -m pytest -q \
            tests/test_activity_monitor.py \
            tests/test_observatory_live.py \
            tests/test_autonomy_adapters_cli.py \
            tests/test_autonomy_recovery.py \
            tests/test_autonomy_runtime.py \
            tests/test_autonomy_store.py

      - name: Test complete repository
        env:
          SISYFUS_AUTO_SERVE: "0"
          SISYFUS_AUTO_OPEN: "0"
        run: python -m pytest -q

      - name: Publish validated implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/live-mission-control
          rm -f .github/workflows/apply-live-mission-control.yml
          git add -- \
            SKILL.md \
            references/live-mission-control.md \
            src/sisyfus/activity.py \
            src/sisyfus/research_v2/live.py \
            src/sisyfus/research_v2/observatory.py \
            src/sisyfus/research_v2/engine.py \
            src/sisyfus/cli.py \
            src/sisyfus/autonomy/cli.py \
            src/sisyfus/autonomy/runtime.py \
            tests/conftest.py \
            tests/test_activity_monitor.py \
            tests/test_observatory_live.py
          git add -u -- \
            .github/live-mission-control \
            .github/workflows/apply-live-mission-control.yml
          git diff --cached --check
          git commit -m "feat: launch live Mission Control on first use"
          git push origin HEAD:feat/autonomous-agent-v08
