name: Apply canonical heartbeat repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-heartbeat-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-agent-v08
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply semantic monotonic heartbeat repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text: str, before: str, after: str, label: str) -> str:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(before, after, 1)

          runtime = Path("src/sisyfus/autonomy/runtime.py")
          text = runtime.read_text(encoding="utf-8")
          text = once(text, "import threading\n", "import threading\nimport time\n", "time import")
          text = once(
              text,
              "    interval_seconds: float | None = None\n",
              "    interval_seconds: float | None = None\n    initial_now: str | None = None\n",
              "initial clock",
          )
          text = once(
              text,
              "            interval = max(0.1, min(10.0, float(self.lease_seconds) / 3.0))",
              "            interval = max(0.02, min(5.0, float(self.lease_seconds) / 6.0))",
              "heartbeat interval",
          )
          text = once(
              text,
              "        self._thread: threading.Thread | None = None\n",
              "        self._thread: threading.Thread | None = None\n"
              "        self._renew_lock = threading.Lock()\n"
              "        self._started_monotonic = time.monotonic()\n",
              "heartbeat state",
          )
          text = once(
              text,
              "    def __enter__(self) -> \"LeaseHeartbeat\":\n        self._thread = threading.Thread(\n",
              "    def __enter__(self) -> \"LeaseHeartbeat\":\n"
              "        self.refresh()\n"
              "        self._thread = threading.Thread(\n",
              "eager renewal",
          )
          methods = (
              "        return self\n\n"
              "    def _now(self) -> str | None:\n"
              "        if self.initial_now is None:\n"
              "            return None\n"
              "        base = datetime.fromisoformat(self.initial_now.replace(\"Z\", \"+00:00\"))\n"
              "        if base.tzinfo is None:\n"
              "            base = base.replace(tzinfo=timezone.utc)\n"
              "        elapsed = max(0.0, time.monotonic() - self._started_monotonic)\n"
              "        return (\n"
              "            base.astimezone(timezone.utc) + timedelta(seconds=elapsed)\n"
              "        ).isoformat(timespec=\"microseconds\").replace(\"+00:00\", \"Z\")\n\n"
              "    def refresh(self) -> None:\n"
              "        self.check()\n"
              "        try:\n"
              "            with self._renew_lock:\n"
              "                self.store.renew_lease(\n"
              "                    self.continuation_id,\n"
              "                    worker_id=self.worker_id,\n"
              "                    lease_token=self.lease_token,\n"
              "                    lease_seconds=self.lease_seconds,\n"
              "                    now=self._now(),\n"
              "                    record_event=False,\n"
              "                )\n"
              "        except BaseException as exc:\n"
              "            self._error = exc\n"
              "            self._lost.set()\n"
              "            raise LeaseLost(\n"
              "                f\"lease renewal failed for {self.continuation_id}: {exc}\"\n"
              "            ) from exc\n\n"
              "    def _run(self) -> None:\n"
          )
          text = once(text, "        return self\n\n    def _run(self) -> None:\n", methods, "heartbeat methods")
          run_start = text.index("    def _run(self) -> None:", text.index("class LeaseHeartbeat:"))
          run_end = text.index("    def check(self) -> None:", run_start)
          run_block = (
              "    def _run(self) -> None:\n"
              "        assert self.interval_seconds is not None\n"
              "        while not self._stop.wait(self.interval_seconds):\n"
              "            try:\n"
              "                self.refresh()\n"
              "            except LeaseLost:\n"
              "                return\n\n"
          )
          text = text[:run_start] + run_block + text[run_end:]
          text = once(
              text,
              "            str(continuation[\"lease_token\"]),\n            lease_seconds,\n        )",
              "            str(continuation[\"lease_token\"]),\n"
              "            lease_seconds,\n"
              "            initial_now=now,\n"
              "        )",
              "heartbeat construction",
          )
          for before, after, label in (
              (
                  "        heartbeat.check()\n        try:\n            result = binding.capability.execute(",
                  "        heartbeat.refresh()\n        try:\n            result = binding.capability.execute(",
                  "before capability",
              ),
              (
                  "        heartbeat.check()\n        current = self._current_owned(str(current[\"id\"]), worker_id)\n        _, verifying = self.store.record_execution(",
                  "        heartbeat.refresh()\n        current = self._current_owned(str(current[\"id\"]), worker_id)\n        _, verifying = self.store.record_execution(",
                  "after capability",
              ),
              (
                  "    ) -> TickResult:\n        heartbeat.check()\n        try:\n            verification = binding.verifier.verify(",
                  "    ) -> TickResult:\n        heartbeat.refresh()\n        try:\n            verification = binding.verifier.verify(",
                  "before verifier",
              ),
              (
                  "        heartbeat.check()\n        current = self._current_owned(str(continuation[\"id\"]), worker_id)\n        return self._settle(",
                  "        heartbeat.refresh()\n        current = self._current_owned(str(continuation[\"id\"]), worker_id)\n        return self._settle(",
                  "before settlement",
              ),
          ):
              text = once(text, before, after, label)
          runtime.write_text(text, encoding="utf-8")

          store = Path("src/sisyfus/autonomy/store.py")
          text = store.read_text(encoding="utf-8")
          start = text.index("    def renew_lease(")
          end = text.index("    def _owned_row(", start)
          renew = (
              "    def renew_lease(\n"
              "        self,\n"
              "        continuation_id: str,\n"
              "        *,\n"
              "        worker_id: str,\n"
              "        lease_token: str,\n"
              "        lease_seconds: float = 60.0,\n"
              "        now: str | None = None,\n"
              "        record_event: bool = True,\n"
              "    ) -> dict[str, Any]:\n"
              "        current = _canonical_ts(now or utc_now())\n"
              "        expires = _add_seconds(current, lease_seconds)\n"
              "        with self._transaction() as connection:\n"
              "            cursor = connection.execute(\n"
              "                \"\"\"\n"
              "                UPDATE continuations\n"
              "                SET lease_expires_at = ?, heartbeat_at = ?, updated_at = ?\n"
              "                WHERE id = ? AND lease_owner = ? AND lease_token = ?\n"
              "                  AND lease_expires_at IS NOT NULL AND lease_expires_at > ?\n"
              "                  AND state IN (?, ?)\n"
              "                \"\"\",\n"
              "                (\n"
              "                    expires, current, current, continuation_id, worker_id,\n"
              "                    lease_token, current, ContinuationState.RUNNING.value,\n"
              "                    ContinuationState.VERIFYING.value,\n"
              "                ),\n"
              "            )\n"
              "            if cursor.rowcount != 1:\n"
              "                raise LeaseLost(f\"lease expired or is not owned by {worker_id!r}\")\n"
              "            if record_event:\n"
              "                self._append_event(\n"
              "                    connection, continuation_id=continuation_id,\n"
              "                    entity_type=\"continuation\", entity_id=continuation_id,\n"
              "                    event_type=\"LEASE_RENEWED\", actor=worker_id,\n"
              "                    data={\"lease_expires_at\": expires}, now=current,\n"
              "                )\n"
              "            row = connection.execute(\n"
              "                \"SELECT * FROM continuations WHERE id = ?\", (continuation_id,)\n"
              "            ).fetchone()\n"
              "            assert row is not None\n"
              "            return self._row(row) or {}\n\n"
          )
          store.write_text(text[:start] + renew + text[end:], encoding="utf-8")

          test = Path("tests/test_autonomy_recovery.py")
          text = test.read_text(encoding="utf-8")
          text = once(text, "from dataclasses import dataclass\n", "from dataclasses import dataclass, field\n", "field import")
          text = once(
              text,
              "    sleep_seconds: float = 0.0\n\n"
              "    def execute(self, arguments: Mapping[str, Any], *, idempotency_key: str) -> CapabilityResult:\n"
              "        self.calls += 1\n"
              "        if self.sleep_seconds:\n",
              "    sleep_seconds: float = 0.0\n"
              "    started: threading.Event | None = field(default=None, repr=False)\n\n"
              "    def execute(self, arguments: Mapping[str, Any], *, idempotency_key: str) -> CapabilityResult:\n"
              "        self.calls += 1\n"
              "        if self.started is not None:\n"
              "            self.started.set()\n"
              "        if self.sleep_seconds:\n",
              "start signal",
          )
          start = text.index("def test_heartbeat_prevents_second_worker_during_slow_capability")
          regression = (
              "def test_heartbeat_prevents_second_worker_during_slow_capability(tmp_path: Path) -> None:\n"
              "    store = make_store(tmp_path)\n"
              "    seed(store, key=\"slow\")\n"
              "    started = threading.Event()\n"
              "    capability = CountingCapability(\n"
              "        replay_safe=True, sleep_seconds=3.4, started=started\n"
              "    )\n"
              "    verifier = CountingVerifier()\n"
              "    runtime = make_runtime(tmp_path, store, capability, verifier)\n"
              "    result_box: list[Any] = []\n\n"
              "    def run_first() -> None:\n"
              "        result_box.append(\n"
              "            runtime.run_once(\n"
              "                worker_id=\"worker-a\",\n"
              "                planner=lambda _c, _x: decision(),\n"
              "                lease_seconds=2.0,\n"
              "            )\n"
              "        )\n\n"
              "    thread = threading.Thread(target=run_first)\n"
              "    thread.start()\n"
              "    assert started.wait(timeout=2)\n"
              "    time.sleep(2.6)\n"
              "    store.recover_expired_leases()\n"
              "    assert store.claim_due_continuation(\"worker-b\", lease_seconds=1.0) is None\n"
              "    thread.join(timeout=6)\n"
              "    assert not thread.is_alive()\n"
              "    assert result_box[0].state == ContinuationState.SUCCEEDED.value\n"
              "    assert capability.calls == 1\n"
          )
          test.write_text(text[:start] + regression, encoding="utf-8")
          PY

      - name: Install
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src

      - name: Repeat heartbeat regression
        env:
          SISYFUS_AUTO_SERVE: "0"
        run: |
          for i in 1 2 3 4 5; do
            python -m pytest -q tests/test_autonomy_recovery.py::test_heartbeat_prevents_second_worker_during_slow_capability
          done

      - name: Test complete repository
        env:
          SISYFUS_AUTO_SERVE: "0"
        run: python -m pytest -q

      - name: Publish validated repair
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-heartbeat-fix.yml
          git add -- src/sisyfus/autonomy/runtime.py src/sisyfus/autonomy/store.py tests/test_autonomy_recovery.py
          git add -u -- .github/workflows/apply-heartbeat-fix.yml
          git diff --cached --check
          git commit -m "fix: harden lease heartbeat fencing"
          git push origin HEAD:feat/autonomous-agent-v08
