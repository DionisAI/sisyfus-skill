name: Apply canonical heartbeat repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-heartbeat-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-agent-v08
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply deterministic lease-heartbeat repair
        shell: bash
        run: |
          cat > /tmp/apply_heartbeat.py <<'PY'
          from pathlib import Path


          def replace_once(text: str, before: str, after: str, label: str) -> str:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(before, after, 1)


          runtime = Path("src/sisyfus/autonomy/runtime.py")
          text = runtime.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "import threading\n",
              "import threading\nimport time\n",
              "time import",
          )
          text = replace_once(
              text,
              "    interval_seconds: float | None = None\n",
              "    interval_seconds: float | None = None\n"
              "    initial_now: str | None = None\n",
              "heartbeat initial timestamp field",
          )
          class_start = text.index("class LeaseHeartbeat:")
          start = text.index("    def __post_init__(self) -> None:", class_start)
          end = text.index("    def check(self) -> None:", start)
          methods = '''    def __post_init__(self) -> None:
              interval = self.interval_seconds
              if interval is None:
                  # Keep a wide scheduling margin. Short leases and loaded hosts must
                  # not lose ownership because one renewal is delayed by SQLite
                  # contention or OS scheduling jitter.
                  interval = max(0.02, min(5.0, float(self.lease_seconds) / 6.0))
              self.interval_seconds = float(interval)
              self._stop = threading.Event()
              self._lost = threading.Event()
              self._error: BaseException | None = None
              self._thread: threading.Thread | None = None
              self._renew_lock = threading.Lock()
              self._started_monotonic = time.monotonic()

          def __enter__(self) -> "LeaseHeartbeat":
              # Begin long work with a complete lease window instead of waiting for
              # the first background renewal.
              self.refresh()
              self._thread = threading.Thread(
                  target=self._run,
                  name=f"sisyfus-heartbeat-{self.continuation_id[:12]}",
                  daemon=True,
              )
              self._thread.start()
              return self

          def _now(self) -> str | None:
              if self.initial_now is None:
                  return None
              base = datetime.fromisoformat(self.initial_now.replace("Z", "+00:00"))
              if base.tzinfo is None:
                  base = base.replace(tzinfo=timezone.utc)
              elapsed = max(0.0, time.monotonic() - self._started_monotonic)
              return (
                  base.astimezone(timezone.utc) + timedelta(seconds=elapsed)
              ).isoformat(timespec="microseconds").replace("+00:00", "Z")

          def refresh(self) -> None:
              self.check()
              try:
                  with self._renew_lock:
                      self.store.renew_lease(
                          self.continuation_id,
                          worker_id=self.worker_id,
                          lease_token=self.lease_token,
                          lease_seconds=self.lease_seconds,
                          now=self._now(),
                          record_event=False,
                      )
              except BaseException as exc:
                  self._error = exc
                  self._lost.set()
                  raise LeaseLost(
                      f"lease renewal failed for {self.continuation_id}: {exc}"
                  ) from exc

          def _run(self) -> None:
              assert self.interval_seconds is not None
              while not self._stop.wait(self.interval_seconds):
                  try:
                      self.refresh()
                  except LeaseLost:
                      return

          '''
          methods = methods.replace("\n          ", "\n    ")
          text = text[:start] + methods + text[end:]
          constructor = '''        heartbeat = LeaseHeartbeat(
              self.store,
              continuation_id,
              worker_id,
              str(continuation["lease_token"]),
              lease_seconds,
          )
          '''
          constructor = constructor.replace("\n          ", "\n        ")
          constructor_new = '''        heartbeat = LeaseHeartbeat(
              self.store,
              continuation_id,
              worker_id,
              str(continuation["lease_token"]),
              lease_seconds,
              initial_now=now,
          )
          '''
          constructor_new = constructor_new.replace("\n          ", "\n        ")
          text = replace_once(
              text,
              constructor,
              constructor_new,
              "heartbeat construction",
          )
          for before, after, label in (
              (
                  '        heartbeat.check()\n        try:\n            result = binding.capability.execute(',
                  '        heartbeat.refresh()\n        try:\n            result = binding.capability.execute(',
                  'pre-capability renewal',
              ),
              (
                  '        heartbeat.check()\n        current = self._current_owned(str(current["id"]), worker_id)\n        _, verifying = self.store.record_execution(',
                  '        heartbeat.refresh()\n        current = self._current_owned(str(current["id"]), worker_id)\n        _, verifying = self.store.record_execution(',
                  'post-capability renewal',
              ),
              (
                  '    ) -> TickResult:\n        heartbeat.check()\n        try:\n            verification = binding.verifier.verify(',
                  '    ) -> TickResult:\n        heartbeat.refresh()\n        try:\n            verification = binding.verifier.verify(',
                  'pre-verifier renewal',
              ),
              (
                  '        heartbeat.check()\n        current = self._current_owned(str(continuation["id"]), worker_id)\n        return self._settle(',
                  '        heartbeat.refresh()\n        current = self._current_owned(str(continuation["id"]), worker_id)\n        return self._settle(',
                  'pre-settlement renewal',
              ),
          ):
              text = replace_once(text, before, after, label)
          runtime.write_text(text, encoding="utf-8")

          store = Path("src/sisyfus/autonomy/store.py")
          text = store.read_text(encoding="utf-8")
          start = text.index("    def renew_lease(")
          end = text.index("    def _owned_row(", start)
          renew = '''    def renew_lease(
              self,
              continuation_id: str,
              *,
              worker_id: str,
              lease_token: str,
              lease_seconds: float = 60.0,
              now: str | None = None,
              record_event: bool = True,
          ) -> dict[str, Any]:
              current = _canonical_ts(now or utc_now())
              expires = _add_seconds(current, lease_seconds)
              with self._transaction() as connection:
                  cursor = connection.execute(
                      """
                      UPDATE continuations
                      SET lease_expires_at = ?, heartbeat_at = ?, updated_at = ?
                      WHERE id = ? AND lease_owner = ? AND lease_token = ?
                        AND lease_expires_at IS NOT NULL AND lease_expires_at > ?
                        AND state IN (?, ?)
                      """,
                      (
                          expires,
                          current,
                          current,
                          continuation_id,
                          worker_id,
                          lease_token,
                          current,
                          ContinuationState.RUNNING.value,
                          ContinuationState.VERIFYING.value,
                      ),
                  )
                  if cursor.rowcount != 1:
                      raise LeaseLost(f"lease expired or is not owned by {worker_id!r}")
                  # High-frequency heartbeat writes update authoritative lease columns
                  # without flooding the immutable audit stream. Explicit/manual
                  # renewals retain their audit event by default.
                  if record_event:
                      self._append_event(
                          connection,
                          continuation_id=continuation_id,
                          entity_type="continuation",
                          entity_id=continuation_id,
                          event_type="LEASE_RENEWED",
                          actor=worker_id,
                          data={"lease_expires_at": expires},
                          now=current,
                      )
                  row = connection.execute(
                      "SELECT * FROM continuations WHERE id = ?", (continuation_id,)
                  ).fetchone()
                  assert row is not None
                  return self._row(row) or {}

          '''
          renew = renew.replace("\n          ", "\n    ")
          text = text[:start] + renew + text[end:]
          store.write_text(text, encoding="utf-8")

          test = Path("tests/test_autonomy_recovery.py")
          text = test.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from dataclasses import dataclass\n",
              "from dataclasses import dataclass, field\n",
              "field import",
          )
          start = text.index("@dataclass\nclass CountingCapability:")
          end = text.index("\n\n@dataclass\nclass CountingVerifier:", start)
          capability = '''@dataclass
          class CountingCapability:
              name: str = "test.action"
              risk_tier: int = 0
              replay_safe: bool = True
              description: str = "test"
              calls: int = 0
              sleep_seconds: float = 0.0
              started: threading.Event | None = field(default=None, repr=False)

              def execute(
                  self,
                  arguments: Mapping[str, Any],
                  *,
                  idempotency_key: str,
              ) -> CapabilityResult:
                  self.calls += 1
                  if self.started is not None:
                      self.started.set()
                  if self.sleep_seconds:
                      time.sleep(self.sleep_seconds)
                  return CapabilityResult(
                      status="OK",
                      observation={"idempotency_key": idempotency_key},
                      metrics={"value": arguments.get("value")},
                  )
          '''
          capability = capability.replace("\n          ", "\n")
          text = text[:start] + capability + text[end:]
          start = text.index(
              "def test_heartbeat_prevents_second_worker_during_slow_capability"
          )
          heartbeat_test = '''def test_heartbeat_prevents_second_worker_during_slow_capability(tmp_path: Path) -> None:
              store = make_store(tmp_path)
              seed(store, key="slow")
              started = threading.Event()
              capability = CountingCapability(
                  replay_safe=True,
                  sleep_seconds=3.4,
                  started=started,
              )
              verifier = CountingVerifier()
              runtime = make_runtime(tmp_path, store, capability, verifier)
              result_box: list[Any] = []

              def run_first() -> None:
                  result_box.append(
                      runtime.run_once(
                          worker_id="worker-a",
                          planner=lambda _c, _x: decision(),
                          lease_seconds=2.0,
                      )
                  )

              thread = threading.Thread(target=run_first)
              thread.start()
              assert started.wait(timeout=2)
              # The initial lease has expired by wall time. Only heartbeat renewal can
              # prevent recovery and a second worker claim.
              time.sleep(2.6)
              store.recover_expired_leases()
              assert store.claim_due_continuation("worker-b", lease_seconds=1.0) is None
              thread.join(timeout=6)
              assert not thread.is_alive()
              assert result_box[0].state == ContinuationState.SUCCEEDED.value
              assert capability.calls == 1
          '''
          heartbeat_test = heartbeat_test.replace("\n          ", "\n")
          text = text[:start] + heartbeat_test + "\n"
          test.write_text(text, encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          marker = "      - name: Export checked-out source for debugging\n"
          if marker in text:
              start = text.index(marker)
              end = text.index(
                  "      - uses: actions/setup-python@v5\n",
                  start,
              )
              text = text[:start] + text[end:]
          ci.write_text(text, encoding="utf-8")
          PY
          python /tmp/apply_heartbeat.py

      - name: Install
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src

      - name: Repeat heartbeat regression
        env:
          SISYFUS_AUTO_SERVE: "0"
        run: |
          for i in 1 2 3; do
            python -m pytest -q tests/test_autonomy_recovery.py::test_heartbeat_prevents_second_worker_during_slow_capability
          done

      - name: Test complete repository
        env:
          SISYFUS_AUTO_SERVE: "0"
        run: python -m pytest -q

      - name: Publish validated repair
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-heartbeat-fix.yml
          git add -- \
            src/sisyfus/autonomy/runtime.py \
            src/sisyfus/autonomy/store.py \
            tests/test_autonomy_recovery.py \
            .github/workflows/ci.yml
          git add -u -- .github/workflows/apply-heartbeat-fix.yml
          git diff --cached --check
          git commit -m "fix: harden lease heartbeat fencing"
          git push origin HEAD:feat/autonomous-agent-v08
