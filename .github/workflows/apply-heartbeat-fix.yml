name: Apply heartbeat fencing repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-heartbeat-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-agent-v08
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Patch heartbeat fencing and deterministic regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, before: str, after: str, label: str) -> str:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(before, after, 1)

          runtime = Path("src/sisyfus/autonomy/runtime.py")
          text = runtime.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "            interval = max(0.1, min(10.0, float(self.lease_seconds) / 3.0))",
              "            interval = max(0.02, min(5.0, float(self.lease_seconds) / 6.0))",
              "heartbeat interval",
          )
          text = replace_once(
              text,
              "        self._thread: threading.Thread | None = None\n",
              "        self._thread: threading.Thread | None = None\n"
              "        self._renew_lock = threading.Lock()\n",
              "heartbeat lock",
          )
          text = replace_once(
              text,
              "    def __enter__(self) -> \"LeaseHeartbeat\":\n"
              "        self._thread = threading.Thread(\n",
              "    def __enter__(self) -> \"LeaseHeartbeat\":\n"
              "        # Begin long work with a complete lease window.\n"
              "        self.refresh()\n"
              "        self._thread = threading.Thread(\n",
              "eager heartbeat",
          )
          text = replace_once(
              text,
              "        return self\n\n"
              "    def _run(self) -> None:\n",
              "        return self\n\n"
              "    def refresh(self) -> None:\n"
              "        self.check()\n"
              "        try:\n"
              "            with self._renew_lock:\n"
              "                self.store.renew_lease(\n"
              "                    self.continuation_id,\n"
              "                    worker_id=self.worker_id,\n"
              "                    lease_token=self.lease_token,\n"
              "                    lease_seconds=self.lease_seconds,\n"
              "                    record_event=False,\n"
              "                )\n"
              "        except BaseException as exc:\n"
              "            self._error = exc\n"
              "            self._lost.set()\n"
              "            raise LeaseLost(\n"
              "                f\"lease renewal failed for {self.continuation_id}: {exc}\"\n"
              "            ) from exc\n\n"
              "    def _run(self) -> None:\n",
              "heartbeat refresh method",
          )
          old_run = '''            try:
              self.store.renew_lease(
                  self.continuation_id,
                  worker_id=self.worker_id,
                  lease_token=self.lease_token,
                  lease_seconds=self.lease_seconds,
              )
          except BaseException as exc:
              self._error = exc
              self._lost.set()
              return
          '''
          old_run = old_run.replace("\n          ", "\n        ").replace("\n              ", "\n            ")
          new_run = '''            try:
              self.refresh()
          except LeaseLost:
              return
          '''
          new_run = new_run.replace("\n          ", "\n        ").replace("\n              ", "\n            ")
          text = replace_once(text, old_run, new_run, "heartbeat loop")
          for before, after, label in (
              (
                  '        heartbeat.check()\n        try:\n            result = binding.capability.execute(',
                  '        heartbeat.refresh()\n        try:\n            result = binding.capability.execute(',
                  'pre-capability refresh',
              ),
              (
                  '        heartbeat.check()\n        current = self._current_owned(str(current["id"]), worker_id)\n        _, verifying = self.store.record_execution(',
                  '        heartbeat.refresh()\n        current = self._current_owned(str(current["id"]), worker_id)\n        _, verifying = self.store.record_execution(',
                  'post-capability refresh',
              ),
              (
                  '    ) -> TickResult:\n        heartbeat.check()\n        try:\n            verification = binding.verifier.verify(',
                  '    ) -> TickResult:\n        heartbeat.refresh()\n        try:\n            verification = binding.verifier.verify(',
                  'pre-verifier refresh',
              ),
              (
                  '        heartbeat.check()\n        current = self._current_owned(str(continuation["id"]), worker_id)\n        return self._settle(',
                  '        heartbeat.refresh()\n        current = self._current_owned(str(continuation["id"]), worker_id)\n        return self._settle(',
                  'pre-settlement refresh',
              ),
          ):
              text = replace_once(text, before, after, label)
          runtime.write_text(text, encoding="utf-8")

          store = Path("src/sisyfus/autonomy/store.py")
          text = store.read_text(encoding="utf-8")
          renew_start = text.index("    def renew_lease(")
          prefix, suffix = text[:renew_start], text[renew_start:]
          suffix = replace_once(
              suffix,
              "        lease_seconds: float = 60.0,\n"
              "        now: str | None = None,\n"
              "    ) -> dict[str, Any]:",
              "        lease_seconds: float = 60.0,\n"
              "        now: str | None = None,\n"
              "        record_event: bool = True,\n"
              "    ) -> dict[str, Any]:",
              "renew signature",
          )
          event = '''            self._append_event(
              connection,
              continuation_id=continuation_id,
              entity_type="continuation",
              entity_id=continuation_id,
              event_type="LEASE_RENEWED",
              actor=worker_id,
              data={"lease_expires_at": expires},
              now=current,
          )
          '''
          event = event.replace("\n          ", "\n            ").replace("\n              ", "\n                ")
          guarded = '''            if record_event:
              self._append_event(
                  connection,
                  continuation_id=continuation_id,
                  entity_type="continuation",
                  entity_id=continuation_id,
                  event_type="LEASE_RENEWED",
                  actor=worker_id,
                  data={"lease_expires_at": expires},
                  now=current,
              )
          '''
          guarded = guarded.replace("\n          ", "\n            ").replace("\n              ", "\n                ")
          suffix = replace_once(suffix, event, guarded, "heartbeat audit guard")
          store.write_text(prefix + suffix, encoding="utf-8")

          test = Path("tests/test_autonomy_recovery.py")
          text = test.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from dataclasses import dataclass\n",
              "from dataclasses import dataclass, field\n",
              "test field import",
          )
          text = replace_once(
              text,
              "    sleep_seconds: float = 0.0\n\n"
              "    def execute(self, arguments: Mapping[str, Any], *, idempotency_key: str) -> CapabilityResult:\n"
              "        self.calls += 1\n"
              "        if self.sleep_seconds:\n",
              "    sleep_seconds: float = 0.0\n"
              "    started: threading.Event | None = field(default=None, repr=False)\n\n"
              "    def execute(self, arguments: Mapping[str, Any], *, idempotency_key: str) -> CapabilityResult:\n"
              "        self.calls += 1\n"
              "        if self.started is not None:\n"
              "            self.started.set()\n"
              "        if self.sleep_seconds:\n",
              "test start signal",
          )
          old_test = '''    capability = CountingCapability(replay_safe=True, sleep_seconds=1.4)
              verifier = CountingVerifier()
              runtime = make_runtime(tmp_path, store, capability, verifier)
              result_box: list[Any] = []

              def run_first() -> None:
                  result_box.append(
                      runtime.run_once(
                          worker_id="worker-a",
                          planner=lambda _c, _x: decision(),
                          lease_seconds=0.6,
                      )
                  )

              thread = threading.Thread(target=run_first)
              thread.start()
              time.sleep(0.9)
          '''
          old_test = old_test.replace("\n              ", "\n    ").replace("\n          ", "\n")
          new_test = '''    started = threading.Event()
              capability = CountingCapability(
                  replay_safe=True,
                  sleep_seconds=3.4,
                  started=started,
              )
              verifier = CountingVerifier()
              runtime = make_runtime(tmp_path, store, capability, verifier)
              result_box: list[Any] = []

              def run_first() -> None:
                  result_box.append(
                      runtime.run_once(
                          worker_id="worker-a",
                          planner=lambda _c, _x: decision(),
                          lease_seconds=2.0,
                      )
                  )

              thread = threading.Thread(target=run_first)
              thread.start()
              assert started.wait(timeout=2)
              # The initial lease has expired by wall time. Only heartbeat
              # renewal can prevent recovery and a second worker claim.
              time.sleep(2.6)
          '''
          new_test = new_test.replace("\n              ", "\n    ").replace("\n          ", "\n")
          text = replace_once(text, old_test, new_test, "heartbeat regression timing")
          text = text.replace("thread.join(timeout=5)", "thread.join(timeout=6)", 1)
          test.write_text(text, encoding="utf-8")
          PY

      - name: Install
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src

      - name: Repeat heartbeat regression
        env:
          SISYFUS_AUTO_SERVE: "0"
        run: |
          for i in 1 2 3; do
            python -m pytest -q tests/test_autonomy_recovery.py::test_heartbeat_prevents_second_worker_during_slow_capability
          done

      - name: Test complete repository
        env:
          SISYFUS_AUTO_SERVE: "0"
        run: python -m pytest -q

      - name: Publish validated repair
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-heartbeat-fix.yml
          git add -- \
            src/sisyfus/autonomy/runtime.py \
            src/sisyfus/autonomy/store.py \
            tests/test_autonomy_recovery.py
          git add -u -- .github/workflows/apply-heartbeat-fix.yml
          git diff --cached --check
          git commit -m "fix: harden lease heartbeat fencing"
          git push origin HEAD:feat/autonomous-agent-v08
