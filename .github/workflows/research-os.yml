name: Research OS validation

on:
  pull_request:
  push:
    branches: [feat/closed-loop-research-os]

permissions:
  contents: read

concurrency:
  group: research-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install pytest && python -m pip install -e .
      - name: Make the claims baselines read-only
        run: chmod a-w tests/fixtures/frozen-baselines/*.py
      - name: Regression tests
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_TEST_LOOPBACK: '1'
          SISYFUS_GATEWAY_CLAIMS_BASELINE: ${{ github.workspace }}/tests/fixtures/frozen-baselines/node_claims.0073.py
          SISYFUS_GATEWAY_RESPONSE_CLAIMS_BASELINE: ${{ github.workspace }}/tests/fixtures/frozen-baselines/node_claims.8302.py
        run: |
          mkdir -p validation
          python -m compileall -q src
          python -m pytest -q --junitxml=validation/junit.xml --ignore=tests/test_observatory_live_retention.py --ignore=tests/test_observatory_live_no_trash.py
      - name: Observatory retention tests (retained runner)
        if: ${{ !cancelled() }}
        env:
          SISYFUS_AUTO_SERVE: '0'
        run: python scripts/test_retained.py tests/test_observatory_live_retention.py tests/test_observatory_live_no_trash.py -q --junitxml=validation/retention-junit.xml
      - name: Research OS demonstration
        env:
          SISYFUS_AUTO_SERVE: '0'
        run: |
          python -m sisyfus.research_os.cli demo --workspace validation/demo
      - name: Paired benchmark protocol smoke (no paid provider)
        env:
          SISYFUS_AUTO_SERVE: '0'
        run: |
          python -m sisyfus.research_os.cli benchmark-demo --output validation/benchmark
          python -m sisyfus.research_os.cli benchmark-status --output validation/benchmark/run
      - name: Cross-workspace portfolio and restart smoke
        env:
          SISYFUS_AUTO_SERVE: '0'
        run: |
          python -m sisyfus.research_os.cli portfolio demo --directory validation/portfolio
          python -m sisyfus.research_os.cli portfolio status --directory validation/portfolio/registry
      - name: Source snapshot
        if: always()
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/commit.txt
          git archive --format=tar HEAD | gzip > validation/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-os-validation
          path: validation/
          retention-days: 7
