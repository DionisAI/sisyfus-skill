name: Apply reviewed Research OS continuation
on:
  push:
    branches: [feat/closed-loop-research-os]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and verify locally tested patch
        run: |
          cat .github/research-os-next-patch.0 .github/research-os-next-patch.1 .github/research-os-next-patch.1b .github/research-os-next-patch.2 .github/research-os-next-patch.3 .github/research-os-next-patch.4 | base64 -d | gzip -d > /tmp/research-os-next.patch
          echo "05264e7315d534e43d8f27758612b3daa2a0c428b1bb5031ccc68a0cd0c0b5e0  /tmp/research-os-next.patch" | sha256sum -c -
          git apply --check /tmp/research-os-next.patch
          git apply /tmp/research-os-next.patch
          rm .github/research-os-next-patch.0 .github/research-os-next-patch.1 .github/research-os-next-patch.1b .github/research-os-next-patch.2 .github/research-os-next-patch.3 .github/research-os-next-patch.4
          rm .github/workflows/research-os-next-transfer.yml
      - name: Validate exact patched tree
        env:
          SISYFUS_AUTO_SERVE: '0'
        run: |
          python -m pip install pytest
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(research-os): add learnable SOP and address review findings'
          git push origin HEAD:refs/heads/feat/closed-loop-research-os
