name: Fix Intake feed flicker

on:
  push:
    branches:
      - feat/self-update-v081
    paths:
      - .github/intake-flicker/**
      - .github/workflows/apply-intake-flicker-fix.yml

permissions:
  contents: write

concurrency:
  group: intake-flicker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/self-update-v081
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply frontend fix
        run: python .github/intake-flicker/apply.py
      - name: Install
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Targeted Mission Control tests
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
        run: |
          python -m pytest -q \
            tests/test_intake_frontend_stability.py \
            tests/test_activity_monitor.py \
            tests/test_visual_consistency.py \
            tests/test_observatory_live.py
      - name: Complete repository tests
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
          SISYFUS_UPDATE_FORCE_STDLIB: '1'
        run: python -m pytest -q
      - name: Publish validated fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/sisyfus/activity.py \
            tests/test_intake_frontend_stability.py \
            RELEASE_NOTES_v0.8.1.md
          git diff --cached --check
          git commit -m 'fix: stop repeated Intake feed animations'
          git pull --rebase origin feat/self-update-v081
          git push origin HEAD:feat/self-update-v081
