name: Branch validation report

on:
  push:
    branches:
      - feat/autonomous-agent-v08

permissions:
  contents: write

concurrency:
  group: branch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run validation and persist report
        shell: bash
        run: |
          set +e
          mkdir -p .github/validation
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "== install =="
            python -m pip install --upgrade pip pytest
            python -m pip install -e .
            install_rc=$?
            echo "install_rc=${install_rc}"
            echo
            echo "== compileall =="
            python -m compileall -q src
            compile_rc=$?
            echo "compile_rc=${compile_rc}"
            echo
            echo "== pytest =="
            SISYFUS_AUTO_SERVE=0 python -m pytest -q
            pytest_rc=$?
            echo "pytest_rc=${pytest_rc}"
            echo
            if [ "$install_rc" -eq 0 ] && [ "$compile_rc" -eq 0 ] && [ "$pytest_rc" -eq 0 ]; then
              echo "overall=PASS"
            else
              echo "overall=FAIL"
            fi
            exit 0
          } > .github/validation/latest.txt 2>&1
          cat .github/validation/latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/validation/latest.txt
          git commit -m "ci: record branch validation" || exit 0
          git push origin HEAD:feat/autonomous-agent-v08
