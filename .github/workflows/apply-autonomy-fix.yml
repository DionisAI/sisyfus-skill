name: Apply canonical autonomy runtime fix

on:
  push:
    branches:
      - feat/autonomous-agent-v08
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-autonomy-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-agent-v08
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply canonical runtime payload
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/autonomy-fix/part-*.b64 | base64 -d > /tmp/sisyfus-autonomy-fix.tgz
          echo "595d1643d2dc68a514c8e783979dca14b9a99b6cf96cf00130d33562fe155517  /tmp/sisyfus-autonomy-fix.tgz" | sha256sum -c -
          rm -rf src/sisyfus/autonomy
          tar -xzf /tmp/sisyfus-autonomy-fix.tgz -C .
          rm -f tests/autonomy_testkit.py
          rm -f tests/test_autonomy_supervisor.py

      - name: Install
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src

      - name: Test complete repository
        env:
          SISYFUS_AUTO_SERVE: "0"
        run: python -m pytest -q

      - name: Publish validated fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/autonomy-fix
          rm -f .github/workflows/apply-autonomy-fix.yml
          git add -- \
            src/sisyfus/autonomy \
            tests/test_autonomy_adapters_cli.py \
            tests/test_autonomy_recovery.py \
            tests/test_autonomy_runtime.py \
            tests/test_autonomy_store.py
          git add -u -- \
            src/sisyfus/autonomy \
            tests/autonomy_testkit.py \
            tests/test_autonomy_supervisor.py \
            .github/workflows/apply-autonomy-fix.yml \
            .github/autonomy-fix
          git diff --cached --check
          git commit -m "fix: unify autonomy runtime and harden recovery"
          git push origin HEAD:feat/autonomous-agent-v08
