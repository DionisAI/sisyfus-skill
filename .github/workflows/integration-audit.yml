name: Integration audit
on:
  push:
    branches: [feat/self-update-v081]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SISYFUS_AUTO_SERVE: '0'
      SISYFUS_AUTO_OPEN: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q --junitxml=updater-tests.xml
      - name: Reproducible review inputs
        if: always()
        run: |
          git bundle create repository.bundle --all
          git show-ref > refs.txt
          sha256sum repository.bundle > repository.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-audit
          path: |
            repository.bundle
            repository.sha256
            refs.txt
            updater-tests.xml
          retention-days: 7
