name: CI

on:
  push:
    branches:
      - main
      - feat/autonomous-agent-v08
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src

      - name: Make the claims baselines read-only
        run: chmod a-w tests/fixtures/frozen-baselines/*.py
      - name: Test
        env:
          SISYFUS_AUTO_SERVE: "0"
          SISYFUS_TEST_LOOPBACK: "1"
          SISYFUS_GATEWAY_CLAIMS_BASELINE: ${{ github.workspace }}/tests/fixtures/frozen-baselines/node_claims.0073.py
          SISYFUS_GATEWAY_RESPONSE_CLAIMS_BASELINE: ${{ github.workspace }}/tests/fixtures/frozen-baselines/node_claims.8302.py
        run: python -m pytest -q --ignore=tests/test_observatory_live_retention.py --ignore=tests/test_observatory_live_no_trash.py

      - name: Observatory retention tests (retained runner)
        if: ${{ !cancelled() }}
        env:
          SISYFUS_AUTO_SERVE: "0"
        run: python scripts/test_retained.py tests/test_observatory_live_retention.py tests/test_observatory_live_no_trash.py -q
