name: Apply unified Arena visual system

on:
  push:
    branches:
      - feat/autonomous-agent-v08
    paths:
      - .github/unified-arena/**
      - .github/workflows/apply-unified-arena.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/unified-arena/**
      - .github/workflows/apply-unified-arena.yml

permissions:
  contents: write

concurrency:
  group: apply-unified-arena-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Materialize, test, and publish one visual system for preflight and research maps.
jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-agent-v08
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply shared theme and broadcast shell
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/unified-arena/apply.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('font-weight:900; }"', 'font-weight:900; }}"', 2),
              ('"#sf-live-hud .sf-phase {', '"#sf-live-hud .sf-phase {{', 2),
              ('"#sf-live-hud .sf-progress {', '"#sf-live-hud .sf-progress {{', 2),
              ('"#sf-live-hud .sf-progress i {', '"#sf-live-hud .sf-progress i {{', 2),
          ]
          for before, after, expected in replacements:
              count = text.count(before)
              if count != expected:
                  raise SystemExit(f'unexpected patcher marker count {count} != {expected}: {before!r}')
              text = text.replace(before, after)
          path.write_text(text, encoding='utf-8')
          PY
          python .github/unified-arena/apply.py
          python scripts/sync_skill_assets.py

      - name: Install
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test visual continuity and monitor lifecycle
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
        run: |
          python -m pytest -q \
            tests/test_visual_consistency.py \
            tests/test_activity_monitor.py \
            tests/test_observatory_live.py \
            tests/test_skill_clarification_gate.py \
            tests/test_skill_assets_sync.py

      - name: Test complete repository
        env:
          SISYFUS_AUTO_SERVE: '0'
          SISYFUS_AUTO_OPEN: '0'
        run: python -m pytest -q

      - name: Publish validated unified Arena
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github/unified-arena
          rm -f .github/workflows/apply-unified-arena.yml
          git add -- \
            references/live-mission-control.md \
            src/sisyfus/skill_assets/sisyfus-research/references/live-mission-control.md \
            src/sisyfus/ui_theme.py \
            src/sisyfus/activity.py \
            src/sisyfus/research_v2/observatory.py \
            tests/test_visual_consistency.py
          git add -u -- \
            .github/unified-arena \
            .github/workflows/apply-unified-arena.yml
          git diff --cached --check
          git commit -m 'feat: unify bootstrap and Arena visual language'
          git push origin HEAD:feat/autonomous-agent-v08
